<!DOCTYPE html>
<html lang="en">
  <!--
    Simple Agent page
    Local chatbot interface with prompt chips, dropdown prompt library, and message board.
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Agent</title>
    <link rel="stylesheet" href="../stylesheet.css" />
  </head>
  <body>
    <!-- Navigation + burger menu -->
    <nav class="navbar">
      <div class="navbar-container">
        <div class="logo">FreddyCr00kz</div>

        <button class="burger" id="burgerBtn" aria-label="Open menu" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <ul class="nav-menu" id="navMenu">
          <li><a href="home.html">Home</a></li>
          <li><a href="agent.html">Simple Agent</a></li>
          <li class="nav-item nav-dropdown">
            <button type="button" class="nav-dropdown-toggle" aria-expanded="false" aria-controls="findings-menu">
              Findings
            </button>
            <ul class="nav-submenu" id="findings-menu">
              <li><a href="services.html#core-findings">Core references</a></li>
              <li><a href="services.html#quick-wins">Helpful scripts</a></li>
            </ul>
          </li>
          <li><a href="contact.html">About</a></li>
        </ul>
      </div>
    </nav>

    <div class="page-top-bar">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="home.html">Home</a>
        <span class="separator">/</span>
        <span class="current">Simple Agent</span>
      </nav>
    </div>

    <!-- Agent chat app -->
    <main class="page-shell">
      <div class="app agent-card">
        <div class="agent-header">
          <div class="agent-header-row">
            <div>
              <p class="eyebrow eyebrow-light">AI assistant</p>
              <h1>Simple Agent</h1>
            </div>
            <button type="button" class="ghost-button" id="clear-chat">Clear chat</button>
          </div>
          <div class="status-pill"><span class="status-dot"></span>Online & ready</div>
        </div>
        <section id="chat-output" class="chat" aria-live="polite"></section>

        <div class="prompt-row" aria-label="Suggested prompts">
          <button type="button" class="prompt-chip" data-prompt="Give me a simple navbar example">Navbar example</button>
          <button type="button" class="prompt-chip" data-prompt="How do I build a card component in CSS?">Card CSS</button>
          <button type="button" class="prompt-chip" data-prompt="How do I make a responsive layout?">Responsive layout</button>
          <button type="button" class="prompt-chip" data-prompt="What are good accessibility practices in HTML?">A11y basics</button>
          <button type="button" class="prompt-chip" data-prompt="How can I improve my frontend workflow?">Workflow tips</button>
          <button type="button" class="prompt-chip" data-prompt="How do I debug a broken JavaScript script?">Debugging</button>
        </div>

        <div class="composer">
          <input id="user-input" type="text" placeholder="Type a message..." aria-label="Message" />
          <button id="send-button" type="button">Send</button>
        </div>
      </div>
    </main>

    <script src="../JS/burger.js"></script>
    <script src="../JS/agent.js"></script>
  </body>
</html>
